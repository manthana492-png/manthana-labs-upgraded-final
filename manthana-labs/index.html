<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />

    <!-- GA4 (gtag.js) is loaded only after the user accepts cookies.
         See src/components/consent/CookieConsent.tsx — it sets Consent Mode
         defaults to "denied" and injects the gtag.js script on accept. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      window.gtag = gtag;
      // Consent Mode v2 defaults — denied until the user opts in.
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 500
      });
    </script>

    <!-- PWA / Installable App -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="Manthana-Labs" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS / iPadOS install support -->
